experiment_id: g2f_history
data_dir: ../data
output_dir: ../outputs

model:
  name: aquacrop
  parameters:
    crop: Maize
    model_version: "3.1.0"

selection:
  environments: []
  all_eligible_environments: true
  calibration_years: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
  evaluation_years: [2023]
  allow_assumed_rainfed: true
  exclude_default_soil_from_calibration: true

simulation:
  scan_fractions: [1.0]
  scan_all_dates: true
  workers: 1
  parameter_sets:
    default: {}
    calibrated:
      source: calibration
