# 2026-10-27: G2F full_year same-site historical scenarios only; no legacy POWER.
# 2024 simulations/candidates stop at 2024-11-10, NOT the forecast information cutoff.
# Keep 2023 evaluation/cutoff and scientific parameters; use new forecast/source IDs.
experiment_id: g2f_dssat_forecast_demo
data_dir: ../data
output_dir: ../outputs

model:
  name: dssat
  parameters:
    model_version: "4.8.6.2"
    cultivar: IB0035
    P1: 259.0
    G2: 924.3
    simulation_horizon_days: 365

selection:
  environments:
    - INH1_2023
    - MOH2_2023
    - NYH2_2023
  calibration_years: [2022]
  evaluation_years: [2023]
  allow_assumed_rainfed: true
  exclude_default_soil_from_calibration: false
  source_experiment_id: g2f_dssat_demo

calibration:
  phenology_grid: [150.0, 350.0, 50.0]
  phenology_fine_step: 10.0
  yield_grid: [700.0, 950.0, 50.0]
  yield_fine_step: 10.0

simulation:
  scan_fractions: [0.95]
  scan_all_dates: true
  scan_horizon: cross_year
  workers: 1
  parameter_sets:
    calibrated:
      source: calibration
  forecast_cutoff_year: 2023
  forecast_cutoff_month: 3
  forecast_cutoff_day: 1
  forecast_radius_days: 14
  forecast_step_days: 1
  forecast_fraction: 0.95
