# 2026-10-27: G2F full_year normalized weather only; no legacy POWER cache.
# 2024 simulations/candidates end by 2024-11-10; keep leap day and missing values.
# Use a new experiment_id when old snapshots/results already exist.
experiment_id: g2f_dssat_demo
data_dir: ../data
output_dir: ../outputs

model:
  name: dssat
  parameters:
    model_version: "4.8.6.2"
    cultivar: IB0035
    # CERES-Maize reference: P1 and G2 are calibrated against 2022 only.
    P1: 259.0
    G2: 924.3
    simulation_horizon_days: 365
    # Reference scenario (not site-observed):
    # deep sandy loam IB00000007, 120 kg N/ha at planting,
    # rainfed, no irrigation, initial soil water from soil profile.

selection:
  environments:
    - INH1_2022
    - MOH2_2022
    - NYH2_2022
    - INH1_2023
    - MOH2_2023
    - NYH2_2023
  calibration_years: [2022]
  evaluation_years: [2023]
  allow_assumed_rainfed: true
  exclude_default_soil_from_calibration: false

calibration:
  phenology_grid: [150.0, 350.0, 50.0]
  phenology_fine_step: 10.0
  yield_grid: [700.0, 950.0, 50.0]
  yield_fine_step: 10.0

simulation:
  scan_fractions: [0.90, 0.95]
  scan_all_dates: true
  scan_horizon: cross_year
  # Append same-site next-year G2F records only with cross_year + this mapping.
  # MOH2_2024 is unavailable; mapped 2024 core gaps remain failures, not zero-fill.
  continuation_weather_by_environment:
    INH1_2022: INH1_2023
    MOH2_2022: MOH2_2023
    NYH2_2022: NYH2_2023
    INH1_2023: INH1_2024
    NYH2_2023: NYH2_2024
  workers: 2
  parameter_sets:
    default: {}
    calibrated:
      source: calibration
