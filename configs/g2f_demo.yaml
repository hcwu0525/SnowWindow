# 2026-10-27: G2F full_year normalized weather only; no legacy POWER cache.
# 2024 simulations/candidates end by 2024-11-10; keep leap day and missing values.
# Use a new experiment_id when old snapshots/results already exist.
experiment_id: g2f_demo
data_dir: ../data
output_dir: ../outputs

model:
  name: aquacrop
  parameters:
    crop: MaizeGDD
    model_version: "3.1.0"
    grain_standard_moisture_fraction: 0.155
    default_soil_texture: Loam

selection:
  environments:
    - INH1_2022
    - MOH2_2022
    - NYH2_2022
    - INH1_2023
    - MOH2_2023
    - NYH2_2023
  calibration_years: [2022]
  evaluation_years: [2023]
  allow_assumed_rainfed: true
  exclude_default_soil_from_calibration: true

calibration:
  phenology_grid: [0.8, 1.2, 0.02]
  phenology_fine_step: 0.005
  yield_grid: [0.35, 0.55, 0.01]
  yield_fine_step: 0.0025

simulation:
  scan_fractions: [0.90, 0.95]
  scan_all_dates: true
  scan_horizon: cross_year
  # Append same-site next-year G2F records only with cross_year + this mapping.
  # MOH2_2024 is unavailable; mapped 2024 core gaps remain failures, not zero-fill.
  continuation_weather_by_environment:
    INH1_2022: INH1_2023
    MOH2_2022: MOH2_2023
    NYH2_2022: NYH2_2023
    INH1_2023: INH1_2024
    NYH2_2023: NYH2_2024
  workers: 1
  parameter_sets:
    default: {}
    calibrated:
      source: calibration
