experiment_id: g2f_demo
data_dir: ../data
output_dir: ../outputs

model:
  name: aquacrop
  parameters:
    crop: Maize
    model_version: "3.1.0"
    grain_standard_moisture_fraction: 0.155
    default_soil_texture: Loam

selection:
  environments:
    - INH1_2022
    - MOH2_2022
    - NYH2_2022
    - INH1_2023
    - MOH2_2023
    - NYH2_2023
  calibration_years: [2022]
  evaluation_years: [2023]
  allow_assumed_rainfed: true
  exclude_default_soil_from_calibration: true

simulation:
  scan_fractions: [1.0]
  scan_all_dates: true
  scan_horizon: cross_year
  continuation_weather_by_environment: {}
  workers: 1
  parameter_sets:
    default: {}
    calibrated:
      source: calibration
