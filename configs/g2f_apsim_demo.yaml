experiment_id: g2f_apsim_demo
data_dir: ../data
output_dir: ../outputs

model:
  name: apsim
  parameters:
    model_version: "2026.9.8116.0"
    cultivar: Dekalb_XL82
    simulation_horizon_days: 365
    juvenile_tt: 211.0
    grain_number_scale: 1.0

selection:
  environments:
    - INH1_2022
    - MOH2_2022
    - NYH2_2022
    - INH1_2023
    - MOH2_2023
    - NYH2_2023
  calibration_years: [2022]
  evaluation_years: [2023]
  allow_assumed_rainfed: true
  exclude_default_soil_from_calibration: false
  juvenile_tt_grid: [100.0, 350.0, 25.0]
  juvenile_tt_fine_step: 5.0
  grain_number_scale_grid: [0.5, 1.5, 0.1]
  grain_number_scale_fine_step: 0.02

simulation:
  scan_fractions: [0.90, 0.95]
  scan_all_dates: true
  scan_horizon: cross_year
  workers: 2
  parameter_sets:
    default: {}
    calibrated:
      source: calibration
