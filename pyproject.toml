[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowwindow"
version = "0.1.0"
description = "Reproducible planting-window experiments for G2F crop simulations"
requires-python = ">=3.9,<3.13"
dependencies = [
    "pandas>=2.0,<3",
    "pyarrow>=15,<26",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.16,<0.17",
]

[project.scripts]
snowwindow = "snowwindow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: read-only tests against the supplied real G2F data",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
