[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowwindow"
version = "0.1.0"
description = "Reproducible planting-window experiments for G2F crop simulations"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aquacrop==3.1.0",
    "matplotlib>=3.8,<4",
    "numpy>=1.24,<2",
    "pandas>=2.0,<3",
    "pyarrow>=15,<26",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff==0.16.8",
]

[project.scripts]
snowwindow = "snowwindow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: real-model or supplied-data checks (temporary outputs only)",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
